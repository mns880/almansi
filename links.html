<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقمشة المنسي</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7efe2;--ink:#12302e;--wine:#0e5750;--gold:#b8934f;--card:#fffaf0;--line:#e6d6b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at top left,#fffaf0 0,transparent 55%),radial-gradient(ellipse at bottom right,#efe0c6 0,transparent 60%)}
main{max-width:500px;margin:0 auto;padding:24px 20px 40px;text-align:center}
.hero{display:block;width:100%;max-width:460px;aspect-ratio:900/560;margin:0 auto 16px;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 82%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 82%,transparent 100%)}
h1.logo{margin:20px auto 34px;max-width:400px}
h1.logo img{display:block;width:100%;height:auto}
p.sub{margin:0 0 22px;font-size:16px;color:var(--wine);font-weight:600}
a.link{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:18px;text-align:right;transition:border-color .15s,transform .15s}
a.link:hover,a.link:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}
a.link:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.ico svg{width:24px;height:24px;fill:#fff}
.wa{background:#1fa855}.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}.fb{background:#1877f2}
.txt{flex:1;line-height:1.3}.txt small{display:block;font-weight:400;font-size:13px;opacity:.65}
.tag{margin:0;font-size:20px;font-weight:600;color:var(--gold)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 34px}
.orn i{width:84px;height:1.5px;background:var(--gold)}
.orn b{width:9px;height:9px;background:var(--wine);transform:rotate(45deg)}
.corner{position:fixed;pointer-events:none;z-index:0;mix-blend-mode:multiply;background-size:cover}
